image: Visual Studio 2022

environment:
  # Ускоряем компиляцию Rust, чтобы уложиться в 60-минутный лимит AppVeyor
  CARGO_PROFILE_RELEASE_OPT_LEVEL: 1
  CARGO_PROFILE_RELEASE_LTO: false
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
  CARGO_PROFILE_RELEASE_DEBUG: false
  CARGO_PROFILE_RELEASE_STRIP: true

install:
  - appveyor DownloadFile https://win.rustup.rs/ -FileName rustup-init.exe
  - rustup-init.exe -y --default-host x86_64-pc-windows-msvc --default-toolchain nightly-2026-09-02 --profile minimal
  - set PATH=%PATH%;C:\Users\appveyor\.cargo\bin

build_script:
  # Собираем одним вызовом через --workspace --bins, чтобы не проверять граф дважды
  - cargo build --release --bins

artifacts:
  - path: target/release/*.exe
