image: Visual Studio 2022

install:
  # Скачиваем установщик Rust
  - appveyor DownloadFile https://win.rustup.rs/ -FileName rustup-init.exe
  # Устанавливаем в тихом режиме (-y) с тулчейном под Visual Studio
  - rustup-init.exe -y --default-host x86_64-pc-windows-msvc --default-toolchain nightly
  # Добавляем папку с rustup и cargo в системный PATH текущей сессии
  - set PATH=%PATH%;C:\Users\appveyor\.cargo\bin
  # Проверяем, что всё подхватилось
  - rustc -V
  - cargo -V

build_script:
  # Собираем клиент и сервер в релизном режиме
  - cargo build --release -p mcrs_minecraft_client -p mcrs_minecraft

artifacts:
  - path: target/release/mcrs_minecraft_client.exe
    name: mcrs_client
  - path: target/release/mcrs_minecraft.exe
    name: mcrs_server
