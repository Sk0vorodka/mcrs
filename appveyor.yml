image: Visual Studio 2022

install:
  # Скачиваем установщик Rust
  - appveyor DownloadFile https://win.rustup.rs/ -FileName rustup-init.exe
  # Сразу ставим ту версию nightly, которую требует rust-toolchain.toml проекта, чтобы не качать дважды
  - rustup-init.exe -y --default-host x86_64-pc-windows-msvc --default-toolchain nightly-2026-09-02
  - set PATH=%PATH%;C:\Users\appveyor\.cargo\bin
  - rustc -V
  - cargo -V

build_script:
  # Собираем клиент (в него уже встроен внутренний сервер для запуска миров)
  - cargo build --release -p mcrs_minecraft_client
  # И отдельно собираем дефолтный бинарник выделенного сервера
  - cargo build --release

artifacts:
  # Забираем все готовые .exe файлы из папки release
  - path: target/release/*.exe
